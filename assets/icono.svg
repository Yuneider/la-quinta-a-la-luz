<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>La Quinta a la luz</title>
  <defs>
    <radialGradient id="uv" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A893FF" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#A893FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A893FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="vano">
      <path d="M156 404V246a100 100 0 0 1 200 0v158z"/>
    </clipPath>
  </defs>
  <!-- Fondo: el marrón del museo -->
  <rect width="512" height="512" rx="112" fill="#33200F"/>
  <!-- Interior del vano -->
  <path d="M156 404V246a100 100 0 0 1 200 0v158z" fill="#24150B"/>
  <!-- La luz UV revela lo oculto dentro de la casa -->
  <g clip-path="url(#vano)">
    <circle cx="256" cy="300" r="118" fill="url(#uv)"/>
  </g>
  <circle cx="256" cy="300" r="26" fill="#D7FF5A"/>
  <!-- Arco de la puerta colonial -->
  <path d="M156 404V246a100 100 0 0 1 200 0v158" fill="none" stroke="#D9B866" stroke-width="30" stroke-linejoin="round"/>
  <!-- Umbral -->
  <path d="M112 412h288" stroke="#E9CF7F" stroke-width="30" stroke-linecap="round"/>
</svg>
